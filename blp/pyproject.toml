[project]
name = "husk-blp"
version = "0.1.0"
description = "BLP2 -> PNG texture conversion for husk (see the repo root README.md)"
authors = [
    { name = "Luna Niemitalo", email = "luna.niemitalo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
]

[project.scripts]
husk-blp = "husk_blp:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
