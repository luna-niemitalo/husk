<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLB Viewer</title>
<link rel="stylesheet" href="/static/viewer.css">
</head>
<body>
<div id="viewer"></div>
<div id="hud">
  <div class="panel">
    <div id="title"></div>
    <div id="status"><span id="loading">loading…</span></div>
    <div id="error"></div>
  </div>
</div>
<div id="help">LMB orbit · RMB pan · wheel zoom · click a mesh to inspect it</div>

<div id="controls" class="panel hidden">
  <div class="ctl-section hidden" id="anim-section">
    <div class="ctl-label">Animation</div>
    <div class="row">
      <select id="anim-select"></select>
      <button id="anim-toggle" class="chip">Play</button>
      <label class="chip"><input type="checkbox" id="anim-loop" checked> loop</label>
    </div>
  </div>
  <div class="ctl-section">
    <div class="ctl-label">Lighting</div>
    <div class="ctl-row"><span>Key</span><input type="range" id="light-key" min="0" max="6" step="0.1" value="2.5"></div>
    <div class="ctl-row"><span>Fill</span><input type="range" id="light-fill" min="0" max="6" step="0.1" value="1.0"></div>
    <div class="ctl-row"><span>Ambient</span><input type="range" id="light-hemi" min="0" max="6" step="0.1" value="2.0"></div>
    <div class="ctl-row"><span>Exposure</span><input type="range" id="light-exposure" min="0.1" max="3" step="0.05" value="1"></div>
  </div>
</div>

<div id="pick-info" class="panel hidden"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  }
}
</script>

<!-- The one genuinely per-request value this page needs (which file to
     view) -- set here, before viewer.js loads, since a static .js file
     can't know it on its own. Everything else lives in viewer.js. -->
<script>window.REL = __REL_JSON__;</script>
<script type="module" src="/static/viewer.js"></script>
</body>
</html>
